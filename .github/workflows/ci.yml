name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: build output is committed and current
        run: |
          git status --porcelain -- lib
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo '::error::lib/ differs from a fresh build on this runner — run npm run build and commit the result'
            git diff --stat -- lib
            exit 1
          fi
