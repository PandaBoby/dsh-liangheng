# dsh-liangheng bundle patch: inserts the host plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add link:$PWD`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process and declares the bundled LiangHeng agent preset to the
# agent-preset registry at activation.
- insert:
    - id: liangheng
      name: dsh-liangheng
